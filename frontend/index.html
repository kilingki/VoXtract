<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VoXtract</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>VoXtract</h1>
      <section aria-labelledby="upload-heading">
        <h2 id="upload-heading">녹음 업로드</h2>
        <form id="upload-form">
          <label for="recording">녹음 파일</label>
          <input id="recording" type="file" accept=".m4a,.wav"
                 aria-describedby="upload-formats" required>
          <p id="upload-formats">M4A(AAC) 또는 WAV(PCM) · 최대 2시간</p>
          <button id="upload-button" type="submit" disabled>업로드</button>
          <progress id="upload-progress" aria-label="업로드 진행률" max="1" hidden></progress>
        </form>
        <p id="upload-status" role="status"></p>
        <noscript>녹음을 업로드하거나 작업을 조회하려면 JavaScript를 켜 주세요.</noscript>
      </section>
      <section aria-labelledby="queue-heading">
        <div class="queue-heading">
          <h2 id="queue-heading">작업 목록</h2>
          <button id="refresh" type="button" disabled>새로고침</button>
        </div>
        <p>접수된 녹음은 대기 상태로 저장됩니다. 전사 기능은 다음 단계에서 제공됩니다.</p>
        <p id="queue-status" role="status"></p>
        <ul id="jobs"></ul>
      </section>
    </main>
  </body>
</html>
