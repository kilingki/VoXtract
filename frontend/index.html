<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VoXtract</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">로컬 음성 전사</p>
      <h1>VoXtract</h1>
      <p>갤럭시의 음성 녹음을 로컬 PC에서 전사하고 단어별 시간을 확인하기 위한 프로젝트입니다.</p>
      <section aria-labelledby="scope-heading">
        <h2 id="scope-heading">개발 환경 준비</h2>
        <p>현재는 프로젝트 골격만 제공합니다. 업로드, 전사, 정렬, 내보내기는 아직 구현되지 않았습니다.</p>
        <p id="health" role="status">서버 연결을 확인하고 있습니다.</p>
        <noscript>JavaScript를 사용하면 서버 연결 상태를 확인할 수 있습니다.</noscript>
      </section>
    </main>
  </body>
</html>
